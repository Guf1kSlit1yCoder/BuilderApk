name: Cloud APK Builder

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique Build Job ID"
        required: true
        type: string
      zip_path:
        description: "Path to uploaded source ZIP in repository"
        required: true
        type: string
      gradle_task:
        description: "Gradle task to run (assembleDebug or assembleRelease)"
        required: true
        default: "assembleDebug"
        type: string

jobs:
  build-apk:
    name: "Build ${{ inputs.job_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract and Compile Android Project
        id: compile
        continue-on-error: true
        run: |
          mkdir -p /tmp/work_src /tmp/artifact_out
          unzip -q "${{ inputs.zip_path }}" -d /tmp/work_src

          PROJECT_DIR=$(find /tmp/work_src -maxdepth 3 \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Не найден build.gradle(.kts) или gradlew внутри ZIP-архива!" > /tmp/artifact_out/build_log.txt
            exit 1
          fi

          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew ${{ inputs.gradle_task }} --no-daemon --stacktrace > /tmp/artifact_out/build_log.txt 2>&1
          else
            gradle ${{ inputs.gradle_task }} --no-daemon --stacktrace > /tmp/artifact_out/build_log.txt 2>&1
          fi

          find "$PROJECT_DIR" -name "*.apk" -exec cp {} /tmp/artifact_out/ \;

      - name: Upload APK and Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output-${{ inputs.job_id }}
          path: /tmp/artifact_out/*
          if-no-files-found: warn
          retention-days: 1
