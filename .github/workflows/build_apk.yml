name: Cloud APK Builder
run-name: "Build ${{ inputs.job_id }}"

'on':
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique Build Job ID"
        required: true
        type: string
      zip_path:
        description: "Path to uploaded source ZIP in repository"
        required: true
        type: string
      gradle_task:
        description: "Gradle task to run (assembleDebug or assembleRelease)"
        required: true
        default: "assembleDebug"
        type: string
      anthropic_api_key:
        description: "Anthropic Claude API Key for automated error healing"
        required: false
        default: ""
        type: string

jobs:
  build-apk:
    name: "Build ${{ inputs.job_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # 1. Установка Gradle 8.7 и кэширование зависимостей
      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: false

      # 2. Кэширование реестра и крейтов Rust (Cargo)
      - name: Cache Cargo & Rust Crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-cache
          restore-keys: |
            ${{ runner.os }}-cargo-cache

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # 3. Установка необходимого ARM64 таргета Rust
      - name: Set up Rust Android Target
        run: |
          rustup target add aarch64-linux-android 2>/dev/null || true

      - name: Extract, Adapt and Compile Android Project
        id: compile
        continue-on-error: true
        run: |
          mkdir -p /tmp/work_src /tmp/artifact_out

          # 1. Безопасная распаковка ZIP-архива с нормализацией путей Windows (\ -> /)
          python3 -c "
          import zipfile, os, sys, shutil
          zip_path = sys.argv[1]
          out_dir = sys.argv[2]
          with zipfile.ZipFile(zip_path, 'r') as z:
              for m in z.infolist():
                  clean = m.filename.replace('\\\\', '/').lstrip('/')
                  if not clean:
                      continue
                  target = os.path.join(out_dir, clean)
                  if clean.endswith('/'):
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with z.open(m) as src, open(target, 'wb') as dst:
                          shutil.copyfileobj(src, dst)
          " "${{ inputs.zip_path }}" /tmp/work_src

          # 2. Поиск корневой директории проекта (Gradle или C++/CMake/NDK)
          PROJECT_DIR=$(find /tmp/work_src -maxdepth 4 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/work_src -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | head -n 1)
          fi
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/work_src -maxdepth 4 \( -name "CMakeLists.txt" -o -name "Android.mk" \) -exec dirname {} \; | head -n 1)
          fi
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/work_src -mindepth 1 -maxdepth 2 -type d | head -n 1)
          fi
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="/tmp/work_src"
          fi

          cd "$PROJECT_DIR"

          # 3. Инициализация git-репозитория (защита от git rev-list 128)
          git init -q
          git config user.name "Builder"
          git config user.email "builder@local"
          git add -A
          git commit -q -m "Initial commit" --allow-empty

          # 4. Настройка NDK окружения
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | grep -E "27\." | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | grep -E "26\." | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -n "$NDK_PATH" ]; then
            export ANDROID_NDK_HOME="$NDK_PATH"
            export ANDROID_NDK_ROOT="$NDK_PATH"
          fi

          export CARGO_BUILD_JOBS=$(nproc)

          # 5. Запуск адаптера проектов (AIDE, NDK, генерация Gradle wrapper для C++/CMake)
          if [ -f "$GITHUB_WORKSPACE/scripts/adapt_project.py" ]; then
            python3 "$GITHUB_WORKSPACE/scripts/adapt_project.py" "$PROJECT_DIR"
          fi

          # 6. Если в проекте нет собственного gradlew, генерируем Gradle 8.7 wrapper
          if [ ! -f "./gradlew" ]; then
            echo "gradlew не найден, генерируем Gradle 8.7 wrapper..."
            gradle wrapper --gradle-version 8.7 -q 2>/dev/null || true
            chmod +x ./gradlew 2>/dev/null || true
          fi

          # 7. Запуск сборки
          BUILD_SUCCESS=0
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew ${{ inputs.gradle_task }} --parallel --no-daemon --no-configuration-cache --stacktrace > /tmp/artifact_out/build_log.txt 2>&1 && BUILD_SUCCESS=1 || true
          else
            gradle ${{ inputs.gradle_task }} --parallel --no-daemon --no-configuration-cache --stacktrace > /tmp/artifact_out/build_log.txt 2>&1 && BUILD_SUCCESS=1 || true
          fi

          # 8. Авто-исправление через Claude AI на раннере при сбое
          if [ "$BUILD_SUCCESS" -ne 1 ] && [ -n "${{ inputs.anthropic_api_key }}" ] && [ -f "$GITHUB_WORKSPACE/scripts/claude_build_fixer.py" ]; then
            echo "::warning::Первичная сборка завершилась ошибкой. Запуск авто-исправления через Claude AI..."
            python3 "$GITHUB_WORKSPACE/scripts/claude_build_fixer.py" "$PROJECT_DIR" /tmp/artifact_out/build_log.txt "${{ inputs.anthropic_api_key }}" || true

            echo "Повторный запуск сборки Gradle после правок Claude..."
            if [ -f "./gradlew" ]; then
              ./gradlew ${{ inputs.gradle_task }} --parallel --no-daemon --no-configuration-cache --stacktrace >> /tmp/artifact_out/build_log.txt 2>&1 || true
            else
              gradle ${{ inputs.gradle_task }} --parallel --no-daemon --no-configuration-cache --stacktrace >> /tmp/artifact_out/build_log.txt 2>&1 || true
            fi
          fi

          # 9. Сбор готовых артефактов (APK и нативные .so библиотеки)
          find /tmp/work_src -name "*.apk" -exec cp {} /tmp/artifact_out/ \; 2>/dev/null || true
          find "$PROJECT_DIR" -name "*.apk" -exec cp {} /tmp/artifact_out/ \; 2>/dev/null || true
          find /tmp/work_src -name "*.so" -not -name "libc++_shared.so" -exec cp {} /tmp/artifact_out/ \; 2>/dev/null || true

      # 10. Выгрузка готового APK, .so и лога сборки
      - name: Upload APK and Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output-${{ inputs.job_id }}
          path: /tmp/artifact_out/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 1
