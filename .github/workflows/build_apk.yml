name: Cloud APK Builder
run-name: "Build ${{ inputs.job_id }}"

'on':
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique Build Job ID"
        required: true
        type: string
      zip_path:
        description: "Path to uploaded source ZIP in repository"
        required: true
        type: string
      gradle_task:
        description: "Gradle task to run (assembleDebug or assembleRelease)"
        required: true
        default: "assembleDebug"
        type: string

jobs:
  build-apk:
    name: "Build ${{ inputs.job_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # 1. Установка Gradle 8.7 и кэширование зависимостей
      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: false

      # 2. Кэширование реестра и крейтов Rust (Cargo)
      - name: Cache Cargo & Rust Crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-cache
          restore-keys: |
            ${{ runner.os }}-cargo-cache

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # 3. Установка необходимого ARM64 таргета Rust
      - name: Set up Rust Android Target
        run: |
          rustup target add aarch64-linux-android 2>/dev/null || true

      - name: Extract, Adapt and Compile Android Project
        id: compile
        continue-on-error: true
        run: |
          mkdir -p /tmp/work_src /tmp/artifact_out
          unzip -q "${{ inputs.zip_path }}" -d /tmp/work_src

          # Ищем корневую директорию проекта
          PROJECT_DIR=$(find /tmp/work_src -maxdepth 4 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/work_src -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Не найден build.gradle(.kts) или gradlew внутри ZIP-архива!" > /tmp/artifact_out/build_log.txt
            exit 1
          fi

          cd "$PROJECT_DIR"

          # Инициализируем git-репозиторий, чтобы сборка не падала на git rev-list (код 128)
          git init -q
          git config user.name "Builder"
          git config user.email "builder@local"
          git add -A
          git commit -q -m "Initial commit" --allow-empty

          # Настраиваем NDK, если он доступен на раннере
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ] && [ -n "$ANDROID_HOME" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -n "$NDK_PATH" ]; then
            export ANDROID_NDK_HOME="$NDK_PATH"
            export ANDROID_NDK_ROOT="$NDK_PATH"
            echo "ndk.dir=$NDK_PATH" >> local.properties
          fi

          # Включаем параллельную сборку Rust через все доступные ядра CPU
          export CARGO_BUILD_JOBS=$(nproc)

          # Универсальный адаптер исходников Android (AGP 3/4/7/8/9, AIDE, NDK, CMake, AIDL)
          echo "" | base64 -d > /tmp/adapt_project.py
          python3 /tmp/adapt_project.py "$PROJECT_DIR"

          # Если в проекте нет собственного gradlew, генерируем Gradle 8.7 wrapper
          if [ ! -f "./gradlew" ]; then
            echo "gradlew не найден, генерируем Gradle 8.7 wrapper..."
            gradle wrapper --gradle-version 8.7 -q 2>/dev/null || true
            chmod +x ./gradlew 2>/dev/null || true
          fi

          # Запуск сборки
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew ${{ inputs.gradle_task }} --parallel --no-daemon --no-configuration-cache --stacktrace > /tmp/artifact_out/build_log.txt 2>&1
          else
            gradle ${{ inputs.gradle_task }} --parallel --no-daemon --no-configuration-cache --stacktrace > /tmp/artifact_out/build_log.txt 2>&1
          fi

          # Ищем собранные APK во всей рабочей директории
          find /tmp/work_src -name "*.apk" -exec cp {} /tmp/artifact_out/ \;
          find "$PROJECT_DIR" -name "*.apk" -exec cp {} /tmp/artifact_out/ \;

      # 4. Выгрузка готового APK и лога сборки
      - name: Upload APK and Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output-${{ inputs.job_id }}
          path: /tmp/artifact_out/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 1
