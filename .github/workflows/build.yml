name: Build APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ONDK_VERSION: "r30.1"

jobs:
  build:
    name: Build AltroRoot APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-detect & unpack files
        run: |
          echo "=== Files in repository root ==="
          ls -la
          
          # 1. Если в репозитории лежит zip-архив, автоматически распаковываем его
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Unpacking $zip ..."
              unzip -q -o "$zip"
            fi
          done

          # 2. Если файлы оказались внутри вложенной папки
          if [ ! -d "src" ]; then
            SUB_SRC=$(find . -mindepth 2 -maxdepth 3 -name "src" -type d | head -n 1)
            if [ -n "$SUB_SRC" ]; then
              DIR=$(dirname "$SUB_SRC")
              echo "Found project files inside $DIR. Moving to root..."
              cp -rf "$DIR"/* .
            fi
          fi

          echo "=== Root after unpack ==="
          ls -la
          chmod +x gradlew || true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download & Setup ONDK
        run: |
          mkdir -p "${{ runner.temp }}/ondk"
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"
          rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Build Ghostlock native binary
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make -C src ghostlock
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/native/ghostlock || true

      - name: Build Extractor native binary
        run: |
          export CC_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-C force-unwind-tables=no -C link-arg=-Wl,--icf=all"
          cargo +ondk build --release --target aarch64-linux-android --features http --manifest-path tools/extract_rs/Cargo.toml --target-dir build/extract \
            -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size
          cp build/extract/aarch64-linux-android/release/ghostlock-extract tools/extract_rs/ghostlock-extract-android-arm64

      - name: Export kernel profiles
        run: ./gradlew exportKernelProfiles --no-daemon

      - name: Check Keystore & Build APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
            export KEYSTORE_PATH="../keystore.jks"
            export KEYSTORE_PASS="${{ secrets.KEY_STORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.ALIAS }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            ./gradlew :app:assembleRelease --no-daemon
            cp build/app/outputs/apk/release/*.apk AltroRoot.apk
          else
            echo "No signing secret found, building standard debug APK..."
            ./gradlew :app:assembleDebug --no-daemon
            cp build/app/outputs/apk/debug/*.apk AltroRoot.apk
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AltroRoot-APK
          path: AltroRoot.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AltroRoot Latest Build"
          body: "Автоматическая сборка AltroRoot с новым дизайном Google Play / Material 3."
          files: AltroRoot.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
